name: corpus-drift

on:
  schedule:
    - cron: '30 6 * * 1'   # Monday 06:30 UTC (30 min after keyword-drift)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: clickhouse-antlr4
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: ClickHouse/ClickHouse
          path: ClickHouse
          sparse-checkout: tests/queries/0_stateless
          sparse-checkout-cone-mode: false
      - uses: ./clickhouse-antlr4/.github/actions/setup-antlr
      - name: Diff + triage new fixtures
        id: triage
        working-directory: clickhouse-antlr4
        run: |
          set -euo pipefail
          STAGED=tests/corpus/stateless
          UPSTREAM=../ClickHouse/tests/queries/0_stateless

          # Fixtures we never want in the corpus regardless of whether they parse:
          # non-SQL sub-dialects (KQL/Kusto, PRQL) and deliberate parse-error
          # negative tests. Used to gate what gets staged. Arg: path to the .sql.
          non_sql_or_error() {
            local p="$1" name
            name="$(basename "$p")"
            # Non-SQL sub-dialects — by filename ...
            [[ "$name" =~ [Kk]ql|[Kk]usto|[Pp]rql ]] && return 0
            # ... or by an explicit in-file dialect switch.
            grep -qiE "dialect[[:space:]]*=[[:space:]]*'?(kusto|prql)" "$p" && return 0
            # Deliberate-error fixtures (negative tests).
            grep -qE '\{[[:space:]]*(clientError|serverError)' "$p" && return 0
            return 1
          }

          # Constructs this target-agnostic grammar deliberately cannot accept.
          # Only consulted for fixtures that ALREADY FAILED to parse: such a
          # failure is a known limitation, not a grammar gap, so it must not be
          # reported. A heredoc/raw fixture that happens to parse (e.g. an output
          # `FORMAT TSVRaw` with no inline data, or a heredoc inside `format()`)
          # is still welcome in the corpus, so this is NOT used to gate staging.
          out_of_scope() {
            local p="$1"
            non_sql_or_error "$p" && return 0
            # Heredoc literals ($$...$$ / $tag$...$tag$): tag equality cannot be
            # enforced without semantic predicates (documented limitation).
            grep -qE '\$\$|\$[A-Za-z_][A-Za-z0-9_]*\$' "$p" && return 0
            # INSERT ... FORMAT <Raw-family> with inline data: the bytes after
            # FORMAT are raw, not tokenizable SQL (TSVRaw, TabSeparatedRaw, ...).
            grep -qiE "FORMAT[[:space:]]+[A-Za-z]*Raw\b" "$p" && return 0
            return 1
          }

          # Files upstream we don't yet have.
          comm -23 \
            <(cd "$UPSTREAM" && ls *.sql | sort) \
            <(cd "$STAGED"  && ls *.sql | sort) > /tmp/new.txt || true
          # Stage every new fixture except non-SQL dialects and negative tests;
          # whether the in-scope grammar accepts the rest is decided by parsing.
          : > /tmp/new-candidates.txt
          while read -r f; do
            [[ -z "$f" ]] && continue
            non_sql_or_error "$UPSTREAM/$f" && continue
            cp "$UPSTREAM/$f" "$STAGED/$f"
            echo "$f" >> /tmp/new-candidates.txt
          done < /tmp/new.txt
          # Parse the full corpus.
          if tests/run_tests.sh > /tmp/log.txt 2>&1; then
            echo "all-pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "all-pass=false" >> "$GITHUB_OUTPUT"
            # Separate passing from failing in the staged additions.
            # CorpusRunner relativizes against tests/corpus, so each summary
            # line reads "  FAIL stateless/<name>.sql" — there is NO "corpus/"
            # segment. Strip the "  FAIL stateless/" prefix and ".sql" suffix to
            # recover the bare <name> used to index into $STAGED below. (A stale
            # ".*corpus/stateless/" pattern silently matched nothing, leaving the
            # prefix in place so every later $STAGED/<name>.sql lookup missed —
            # out_of_scope() never ran and the rm never fired.)
            grep '^  FAIL' /tmp/log.txt \
              | sed -E 's|^[[:space:]]*FAIL[[:space:]]+stateless/||;s|\.sql.*$||' \
              > /tmp/failed-all.txt || true
            # Drop out-of-scope fixtures from the failed list — they are not
            # grammar gaps and shouldn't be reported (or kept staged).
            : > /tmp/failed.txt
            while read -r f; do
              [[ -z "$f" ]] && continue
              if [[ -f "$STAGED/${f}.sql" ]] && out_of_scope "$STAGED/${f}.sql"; then
                rm -f "$STAGED/${f}.sql"
                continue
              fi
              echo "$f" >> /tmp/failed.txt
            done < /tmp/failed-all.txt
            # Remove failing ones from staging so the PR only adds passing ones.
            while read -r f; do
              [[ -z "$f" ]] && continue
              rm -f "$STAGED/${f}.sql"
            done < /tmp/failed.txt
          fi
          echo "added=$(wc -l < /tmp/new-candidates.txt)" >> "$GITHUB_OUTPUT"
          echo "failed=$([[ -f /tmp/failed.txt ]] && wc -l < /tmp/failed.txt || echo 0)" >> "$GITHUB_OUTPUT"
      - name: Refresh the corpus size quoted in README
        if: steps.triage.outputs.added != '0'
        working-directory: clickhouse-antlr4
        run: |
          # Staging is now exactly the passing set, so the count is also the
          # numerator. Left untouched if the sentence is ever reworded.
          n=$(find tests/corpus/stateless -name '*.sql' | wc -l)
          sed -i -E "s@^\*\*100% \([0-9]+/[0-9]+\)\*\*@**100% ($n/$n)**@" README.md
      - name: Open PR with new passing fixtures
        if: steps.triage.outputs.added != '0'
        uses: peter-evans/create-pull-request@v8
        with:
          path: clickhouse-antlr4
          branch: corpus/auto-sync
          title: 'corpus: sync new upstream stateless fixtures'
          commit-message: 'corpus: sync new upstream stateless fixtures'
          body: |
            Automated sync of new `tests/queries/0_stateless/*.sql` files from
            ClickHouse upstream that parse cleanly against the current grammar.
          labels: corpus-drift
      - name: Open issue for failing fixtures
        if: steps.triage.outputs.failed != '0'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = await import('node:fs/promises');
            const failing = (await fs.readFile('/tmp/failed.txt', 'utf8')).trim();
            const log = await fs.readFile('/tmp/log.txt', 'utf8');
            const title = `Grammar gaps found in ${failing.split('\n').length} upstream fixtures`;
            const body = `New stateless fixtures that don't parse with the current grammar:\n\n\`\`\`\n${failing}\n\`\`\`\n\n<details><summary>Runner output</summary>\n\n\`\`\`\n${log.slice(0, 60000)}\n\`\`\`\n\n</details>`;
            // The gap set is usually the same week over week until someone
            // fixes the grammar, so refresh the standing report instead of
            // filing a near-identical issue on every run (cf. keyword-drift).
            const { data } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'grammar-gap',
            });
            const existing = data.find(i => !i.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.number, title, body,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, labels: ['corpus-drift', 'grammar-gap'], body,
            });
